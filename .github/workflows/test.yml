name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit Python/Django pairs, not a cross product. Python ranges
        # follow Django's "What Python version can I use with Django?" FAQ,
        # bounded by python_requires (>=3.9) and the 3.9-3.13 classifiers.
        include:
          - {python: "3.9", django: "4.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.9", django: "4.2", name: "without rag extra", extras: "."}
          - {python: "3.10", django: "4.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.10", django: "4.2", name: "without rag extra", extras: "."}
          - {python: "3.11", django: "4.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.11", django: "4.2", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "4.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "4.2", name: "without rag extra", extras: "."}
          - {python: "3.10", django: "5.0", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.10", django: "5.0", name: "without rag extra", extras: "."}
          - {python: "3.11", django: "5.0", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.11", django: "5.0", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "5.0", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "5.0", name: "without rag extra", extras: "."}
          - {python: "3.10", django: "5.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.10", django: "5.1", name: "without rag extra", extras: "."}
          - {python: "3.11", django: "5.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.11", django: "5.1", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "5.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "5.1", name: "without rag extra", extras: "."}
          - {python: "3.13", django: "5.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.13", django: "5.1", name: "without rag extra", extras: "."}
          - {python: "3.10", django: "5.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.10", django: "5.2", name: "without rag extra", extras: "."}
          - {python: "3.11", django: "5.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.11", django: "5.2", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "5.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "5.2", name: "without rag extra", extras: "."}
          - {python: "3.13", django: "5.2", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.13", django: "5.2", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "6.0", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "6.0", name: "without rag extra", extras: "."}
          - {python: "3.13", django: "6.0", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.13", django: "6.0", name: "without rag extra", extras: "."}
          - {python: "3.12", django: "6.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.12", django: "6.1", name: "without rag extra", extras: "."}
          - {python: "3.13", django: "6.1", name: "with rag extra", extras: ".[rag]"}
          - {python: "3.13", django: "6.1", name: "without rag extra", extras: "."}
    name: Test (py${{ matrix.python }}, Django ${{ matrix.django }}, ${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.extras }}
      - name: Pin Django ${{ matrix.django }}
        run: pip install "Django~=${{ matrix.django }}.0"
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: test_settings
        run: python -m django test tests

  commit-email:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: commit-email
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit author emails
        env:
          ALLOWED_COMMIT_EMAIL: ${{ vars.ALLOWED_COMMIT_EMAIL }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$ALLOWED_COMMIT_EMAIL" ]; then
            echo "::error::Repository variable ALLOWED_COMMIT_EMAIL is empty or not set. Define it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          bad=$(git log --no-merges --format='%h %ae' "origin/${BASE_REF}..${HEAD_SHA}" \
            | awk '$2 != ENVIRON["ALLOWED_COMMIT_EMAIL"] { printf "%s%s <%s>", sep, $1, $2; sep = ", " }')
          if [ -n "$bad" ]; then
            echo "::error::Commits with an unexpected author email: ${bad}"
            exit 1
          fi
          echo "All commits use the allowed author email."
