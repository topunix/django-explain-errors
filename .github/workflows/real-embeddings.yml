name: Real embeddings test

# Manual only. Downloads CPU-only PyTorch and a sentence-transformers model,
# so it is kept out of the regular test matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    name: Real-model test (local-embeddings extra, CPU-only torch)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with rag and local-embeddings extras
        run: pip install ".[rag,local-embeddings]"
      - name: Run real-model test
        shell: bash
        env:
          DJANGO_SETTINGS_MODULE: test_settings
          EXPLAIN_ERRORS_TEST_REAL_EMBEDDINGS: "1"
        run: |
          python -m django test tests.test_local_embeddings.RealModelIntegrationTest -v 2 2>&1 | tee real-embeddings.log
          if grep -qi "skipped" real-embeddings.log; then
            echo "::error::The real-model test was skipped, so it verified nothing."
            exit 1
          fi
