name: Evals

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeat every fixture N times (harness --runs)"
        type: number
        default: 3
      fixture:
        description: "Run only this fixture by name (harness --fixture). Empty runs all."
        type: string
        default: ""
      seed:
        description: "Integer seed for A/B position draws (harness --seed). Empty means unseeded."
        type: string
        default: ""
      generator_model:
        description: "Generator model (OPENAI_MODEL). Empty uses the default, gpt-4o-mini."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install package with rag extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag]"
      - name: Run eval harness
        env:
          RUNS: ${{ inputs.runs }}
          FIXTURE: ${{ inputs.fixture }}
          SEED: ${{ inputs.seed }}
          OPENAI_MODEL: ${{ inputs.generator_model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
        run: |
          OPENAI_API_KEY=$(printf '%s' "$OPENAI_API_KEY" | tr -cd 'A-Za-z0-9_-')
          EVAL_JUDGE_API_KEY=$(printf '%s' "$EVAL_JUDGE_API_KEY" | tr -cd 'A-Za-z0-9_-')
          export OPENAI_API_KEY EVAL_JUDGE_API_KEY
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ]; then
            echo "::error::runs must be a positive integer, got '$RUNS'"
            exit 1
          fi
          args=(--runs "$RUNS")
          if [ -n "$FIXTURE" ]; then
            args+=(--fixture "$FIXTURE")
          fi
          if [ -n "$SEED" ]; then
            if ! [[ "$SEED" =~ ^-?[0-9]+$ ]]; then
              echo "::error::seed must be an integer, got '$SEED'"
              exit 1
            fi
            args+=(--seed "$SEED")
          fi
          python evals/run.py "${args[@]}"
      - name: Write summary
        id: summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, statistics

          files = sorted(glob.glob("evals/results/*.json"))
          if not files:
              print("No results file was written.")
              raise SystemExit(0)
          path = files[-1]
          data = json.load(open(path))
          judgments = data["judgments"]
          # Pairs skipped for a generation failure never reached the judge.
          # Results files from before this field existed have none.
          skipped = sum(1 for j in judgments if j.get("judgment_skipped"))
          judged = [j for j in judgments if not j.get("judgment_skipped")]
          failed = sum(1 for j in judged if j["judge_failure"])
          def gen_failed(c):
              flag = c.get("generation_failed")
              if flag is not None:
                  return bool(flag)
              e = c.get("explanation")
              return not (isinstance(e, str) and e.strip())
          gen_failures = sum(1 for c in data["calls"] if gen_failed(c))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"generation_failures={gen_failures}\n")
          print("## Eval results")
          print()
          print(f"- File: `{os.path.basename(path)}`")
          print(f"- Git SHA: `{data['git_sha']}`")
          print(f"- Generator: `{data['generator_model']}`")
          print(f"- Judge: `{data['judge_model']}`")
          print(f"- Runs: {data['runs']}, seed: {data['seed']}")
          print(f"- Generation failures: {gen_failures} of {len(data['calls'])} calls")
          print(f"- Skipped pairs (generation failure, not judged): {skipped}")
          print(f"- Judge failures: {failed} of {len(judged)}")
          print(f"- Judge retries: {data['judge_retries_total']}")
          t = data["timing"]
          print(
              f"- Wall clock: generator {t['generator_seconds']:.1f}s, "
              f"judge {t['judge_seconds']:.1f}s"
          )
          print()
          print("| Group | RAG-on wins | RAG-off wins | Ties |")
          print("|---|---|---|---|")
          for g in ("A", "B"):
              s = [j["winner_side"] for j in judgments
                   if j["group"] == g and not j["judge_failure"]
                   and not j.get("judgment_skipped")]
              print(f"| {g} | {s.count('rag_on')} | {s.count('rag_off')} | {s.count('tie')} |")
          print()
          print("| Side | Mean latency (s) | p50 latency (s) | Calls |")
          print("|---|---|---|---|")
          for label, flag in (("RAG-off", False), ("RAG-on", True)):
              xs = [c["latency_seconds"] for c in data["calls"]
                    if c["rag_enabled"] == flag]
              if xs:
                  print(f"| {label} | {statistics.mean(xs):.2f} | "
                        f"{statistics.median(xs):.2f} | {len(xs)} |")
          print()
          print("CI latency is not comparable with local runs.")
          PY
      - name: Annotate generation failures
        if: always() && steps.summary.outputs.generation_failures != '' && steps.summary.outputs.generation_failures != '0'
        env:
          GENERATION_FAILURES: ${{ steps.summary.outputs.generation_failures }}
        run: |
          echo "::warning::${GENERATION_FAILURES} generation failure(s) in this run; affected pairs were skipped, not judged"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/*.json
          if-no-files-found: error
          retention-days: 90
